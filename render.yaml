services:
  - type: web
    name: omniroute
    env: docker
    region: ohio
    plan: free # Change this if you need more resources
    healthCheckPath: /api/monitoring/health # As specified in their docs/healthcheck
    envVars:
      - key: PORT
        value: "20128"
      - key: OMNIROUTE_BUILD_MEMORY_MB
        value: "2048"
      - key: OMNIROUTE_BUILD_WORKERS
        value: "1"
    disk:
      name: omnidata
      mountPath: /app/data
      sizeGB: 1
